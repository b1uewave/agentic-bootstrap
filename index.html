<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agentic Bootstrap - Premium AI-SOP Scaffold</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A zero-dependency template and interactive CLI to scaffold professional, quality-controlled AI Agent workflows.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Premium Fonts from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Themeable Docsify Core Style -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <!-- Custom Neon-Glassmorphic & Dual Theme Styling (Readability-Focused) -->
  <style>
    /* Theme variables - Optimised for high contrast & premium legibility */
    :root {
      /* Dark Theme (Default) - Spaceship/Slate Dark style */
      --bg-color: #0f172a;           /* Deep Slate Blue (Highly Muted) */
      --text-color: #f1f5f9;         /* Very Light Slate (AAA Legibility) */
      --sidebar-bg: #090d16;         /* Solid Darker Blue-Black for Sidebar */
      --sidebar-border: rgba(255, 255, 255, 0.08);
      --theme-color: #38bdf8;        /* Sky Cyan (Bright but highly readable in dark) */
      --theme-glow: rgba(56, 189, 248, 0.4);
      --theme-accent: #a78bfa;       /* Soft Purple */
      --card-bg: #1e293b;            /* High Contrast Slate Blue */
      --card-border: rgba(255, 255, 255, 0.12);
      --code-bg: #0b0f19;            /* Very dark code block background */
      --code-color: #f43f5e;         /* Bright Rose for inline code */
      --heading-color: #ffffff;      /* Pure White headers */
      --blockquote-bg: #1e293b;
      --blockquote-text: #94a3b8;
      --border-radius: 12px;
      --base-font-size: 17px;        /* Increased size for premium readability */
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body.light-theme {
      /* Light Theme Override - Editorial White style */
      --bg-color: #ffffff;           /* Crisp White background */
      --text-color: #1e293b;         /* Deep Slate Gray (AAA Legibility) */
      --sidebar-bg: #f8fafc;         /* Pure Muted slate-white sidebar */
      --sidebar-border: rgba(0, 0, 0, 0.08);
      --theme-color: #0284c7;        /* Deep Sky Blue for links */
      --theme-glow: rgba(2, 132, 199, 0.3);
      --theme-accent: #6d28d9;       /* Deep Royal Purple */
      --card-bg: #f1f5f9;            /* Clean light-slate card */
      --card-border: rgba(0, 0, 0, 0.08);
      --code-bg: #f8fafc;            /* Crisp light code block */
      --code-color: #be185d;         /* Deep Rose for inline code */
      --heading-color: #0f172a;      /* Bold Slate Blue headers */
      --blockquote-bg: #f1f5f9;
      --blockquote-text: #475569;
    }

    /* Core Layout Styles */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      font-size: var(--base-font-size);
      line-height: 1.8;              /* Elegant line height for text breathing room */
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Floating Theme Toggle Button - Bottom Right (Better UX, avoids GitHub Corner conflict) */
    .theme-toggle-btn {
      position: fixed;
      right: 30px;
      bottom: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: var(--card-bg);
      border: 2px solid var(--theme-color);
      color: var(--theme-color);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .theme-toggle-btn:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 0 20px var(--theme-glow);
    }

    /* GitHub Corner Custom Styling */
    .github-corner svg {
      fill: var(--theme-color) !important;
      color: var(--bg-color) !important;
      transition: all 0.3s ease;
    }

    /* Sidebar Glassmorphism Styling */
    .sidebar {
      background-color: var(--sidebar-bg) !important;
      border-right: 1px solid var(--sidebar-border) !important;
      transition: all 0.3s ease;
    }

    .sidebar-nav ul li a {
      color: #64748b !important; /* Default sidebar text color - elegant gray */
      font-size: 0.95rem;
      padding: 8px 12px !important;
      border-radius: 8px;
      margin: 4px 10px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    body.light-theme .sidebar-nav ul li a {
      color: #475569 !important;
    }

    .sidebar-nav ul li a:hover {
      color: var(--theme-color) !important;
      background-color: rgba(255, 255, 255, 0.04) !important;
      transform: translateX(4px);
    }

    body.light-theme .sidebar-nav ul li a:hover {
      background-color: rgba(0, 0, 0, 0.03) !important;
    }

    .sidebar-nav ul li.active > a {
      color: var(--theme-color) !important;
      font-weight: 600 !important;
      background: rgba(56, 189, 248, 0.08) !important;
      border-left: 3px solid var(--theme-color);
      border-radius: 0 8px 8px 0;
    }

    body.light-theme .sidebar-nav ul li.active > a {
      background: rgba(2, 132, 199, 0.08) !important;
    }

    /* Sidebar Header (App Name) */
    .sidebar .app-name-link {
      font-family: 'Outfit', sans-serif !important;
      font-weight: 700 !important;
      font-size: 1.45rem !important;
      background: linear-gradient(135deg, var(--theme-color), var(--theme-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      padding: 10px 0 !important;
    }

    /* Markdown styling */
    .markdown-section {
      max-width: 900px !important;
      padding: 40px 25px !important;
    }

    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      color: var(--heading-color) !important;
      letter-spacing: -0.5px;
    }

    .markdown-section h1 { 
      font-size: 2.3rem; 
      border-bottom: 2px solid var(--sidebar-border); 
      padding-bottom: 12px; 
      margin-bottom: 25px;
    }
    
    .markdown-section h2 { 
      font-size: 1.7rem; 
      margin-top: 45px; 
      margin-bottom: 15px;
      border-bottom: 1px solid var(--sidebar-border);
      padding-bottom: 6px;
    }

    .markdown-section h3 {
      font-size: 1.3rem;
      margin-top: 35px;
      margin-bottom: 10px;
    }
    
    .markdown-section a {
      color: var(--theme-color) !important;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px dashed var(--theme-color);
      transition: all 0.2s ease;
    }
    
    .markdown-section a:hover {
      border-bottom-style: solid;
      filter: brightness(1.2);
    }

    .markdown-section p, .markdown-section li {
      margin-bottom: 1.25rem;
      letter-spacing: 0.01em;
    }

    /* MacOS Code Terminal Cards Style */
    .markdown-section pre {
      background-color: var(--code-bg) !important;
      border: 1px solid var(--card-border) !important;
      border-radius: var(--border-radius) !important;
      padding: 45px 22px 22px 22px !important;
      position: relative;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3) !important;
      margin: 30px 0 !important;
      overflow-x: auto;
    }

    body.light-theme .markdown-section pre {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06) !important;
    }

    /* The Red, Yellow, Green Window Dots */
    .markdown-section pre::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 20px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #ff5f56;
      box-shadow: 20px 0 0 #ffbd2e, 40px 0 0 #27c93f;
    }

    .markdown-section code {
      font-family: 'Fira Code', 'Courier New', monospace !important;
      background-color: var(--code-bg) !important;
      color: var(--code-color) !important;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.9em;
      border: 1px solid var(--card-border);
      font-weight: 500;
    }

    .markdown-section pre code {
      border: none !important;
      padding: 0 !important;
      background-color: transparent !important;
      color: var(--text-color) !important;
      font-size: 0.9rem !important;
      line-height: 1.6;
    }

    /* High-Contrast Syntax Highlighting Overrides for Dark Mode */
    body:not(.light-theme) .token.comment,
    body:not(.light-theme) .token.prolog,
    body:not(.light-theme) .token.doctype,
    body:not(.light-theme) .token.cdata {
      color: #6272a4 !important; /* Soft Indigo Gray */
      font-style: italic;
    }
    body:not(.light-theme) .token.punctuation {
      color: #cbd5e1 !important;
    }
    body:not(.light-theme) .token.property,
    body:not(.light-theme) .token.tag,
    body:not(.light-theme) .token.constant,
    body:not(.light-theme) .token.symbol,
    body:not(.light-theme) .token.deleted {
      color: #f43f5e !important; /* Rose Red */
    }
    body:not(.light-theme) .token.boolean,
    body:not(.light-theme) .token.number {
      color: #bd93f9 !important; /* Neon Violet */
    }
    body:not(.light-theme) .token.selector,
    body:not(.light-theme) .token.attr-name,
    body:not(.light-theme) .token.string,
    body:not(.light-theme) .token.char,
    body:not(.light-theme) .token.builtin,
    body:not(.light-theme) .token.inserted {
      color: #34d399 !important; /* Fresh Mint Green */
    }
    body:not(.light-theme) .token.operator,
    body:not(.light-theme) .token.entity,
    body:not(.light-theme) .token.url,
    body:not(.light-theme) .language-css .token.string,
    body:not(.light-theme) .style .token.string {
      color: #f8fafc !important;
    }
    body:not(.light-theme) .token.atrule,
    body:not(.light-theme) .token.attr-value,
    body:not(.light-theme) .token.keyword {
      color: #38bdf8 !important; /* Bright Sky Blue */
      font-weight: 600;
    }
    body:not(.light-theme) .token.function,
    body:not(.light-theme) .token.class-name {
      color: #fb923c !important; /* Orange */
    }

    /* Custom Callouts (GitHub Style Alerts) - Improved Contrast */
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color) !important;
      background-color: var(--card-bg) !important;
      border: 1px solid var(--card-border);
      border-radius: 0 8px 8px 0;
      padding: 16px 24px !important;
      margin: 28px 0 !important;
    }

    .markdown-section blockquote p {
      margin: 0 !important;
      font-style: normal;
      color: var(--blockquote-text) !important;
      font-weight: 500;
    }

    /* Mermaid Wrapper Card */
    .mermaid {
      background-color: var(--card-bg) !important;
      border: 1px solid var(--card-border) !important;
      border-radius: var(--border-radius);
      padding: 30px;
      margin: 30px 0;
      display: flex;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      backdrop-filter: blur(8px);
    }

    .mermaid svg {
      max-width: 100% !important;
      height: auto !important;
    }

    /* Table styling - Enhanced legibility */
    .markdown-section table {
      width: 100%;
      margin: 30px 0;
      border-collapse: collapse;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .markdown-section th {
      background-color: rgba(56, 189, 248, 0.08);
      font-weight: 600;
      padding: 12px 15px;
      border-bottom: 2px solid var(--card-border);
      color: var(--heading-color);
      text-align: left;
    }

    body.light-theme .markdown-section th {
      background-color: rgba(2, 132, 199, 0.06);
    }

    .markdown-section td {
      padding: 12px 15px;
      border-bottom: 1px solid var(--card-border);
    }

    .markdown-section tr:last-child td {
      border-bottom: none;
    }

    /* Back-to-top custom anchor spacing */
    .markdown-section hr {
      border: none;
      border-bottom: 1px solid var(--sidebar-border);
      margin: 40px 0;
    }

    /* Responsive adjusts */
    @media screen and (max-width: 768px) {
      .markdown-section {
        padding: 30px 15px !important;
      }
      .markdown-section h1 { font-size: 1.8rem; }
      .markdown-section h2 { font-size: 1.4rem; }
      .theme-toggle-btn {
        right: 20px;
        bottom: 20px;
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <!-- Theme Toggle Floating FAB -->
  <button class="theme-toggle-btn" id="theme-toggle" title="Toggle Theme" aria-label="Toggle Theme">
    🌙
  </button>

  <div id="app">Loading Agentic Bootstrap Portal...</div>

  <!-- Main Config - DISABLED Coverpage for instant access, Repo set for GitHub Corner -->
  <script>
    window.$docsify = {
      name: 'Agentic Bootstrap',
      repo: 'https://github.com/b1uewave/agentic-bootstrap',
      loadSidebar: true,
      coverpage: false,              /* COVERPAGE DISABLED FOR QUICK ACCESS */
      subMaxLevel: 2,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/': 'Search...',
          '/zh-TW/': '搜尋...'
        },
        noData: 'No results!'
      }
    }
  </script>

  <!-- Theme Handler Script -->
  <script>
    const btn = document.getElementById('theme-toggle');
    const body = document.body;
    
    // Read cached preference or default to dark
    const currentTheme = localStorage.getItem('theme') || 'dark';
    if (currentTheme === 'light') {
      body.classList.add('light-theme');
      btn.textContent = '☀️';
    } else {
      btn.textContent = '🌙';
    }

    btn.addEventListener('click', function() {
      if (body.classList.contains('light-theme')) {
        body.classList.remove('light-theme');
        localStorage.setItem('theme', 'dark');
        btn.textContent = '🌙';
      } else {
        body.classList.add('light-theme');
        localStorage.setItem('theme', 'light');
        btn.textContent = '☀️';
      }
    });
  </script>

  <!-- Docsify Core and Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- Mermaid Dynamic Engine and Renderer -->
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        background: '#1e293b',
        primaryColor: '#0f172a',
        primaryTextColor: '#cbd5e1',
        lineColor: '#38bdf8',
        secondaryColor: '#38bdf8',
        tertiaryColor: '#1e293b'
      }
    });
    
    // Auto hook Docsify code block parser
    let num = 0;
    const originCode = window.$docsify.markdown?.renderer?.code || function(code, lang) {
      if (lang === "mermaid") {
        return `<div class="mermaid">${code}</div>`;
      }
      return this.origin.code.apply(this, arguments);
    };

    window.$docsify.markdown = window.$docsify.markdown || {};
    window.$docsify.markdown.renderer = window.$docsify.markdown.renderer || {};
    window.$docsify.markdown.renderer.code = function(code, lang) {
      if (lang === "mermaid") {
        return `<div class="mermaid">${code}</div>`;
      }
      return originCode.apply(this, arguments);
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@latest/dist/docsify-mermaid.js"></script>
</body>
</html>
