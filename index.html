<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agentic Bootstrap - Premium AI-SOP Scaffold</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A zero-dependency template and interactive CLI to scaffold professional, quality-controlled AI Agent workflows.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Premium Dark/Light theme links -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #00b4d8;
      --base-font-size: 16px;
    }
    body {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .sidebar {
      background-color: #f8f9fa;
      border-right: 1px solid #e9ecef;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      font-weight: 700;
      color: #1d3557;
    }
    .markdown-section code {
      background-color: #f1faee;
      color: #e63946;
      border-radius: 4px;
      padding: 3px 6px;
    }
  </style>
</head>
<body>
  <div id="app">Loading Agentic Bootstrap Portal...</div>
  <script>
    window.$docsify = {
      name: 'Agentic Bootstrap',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/': 'Search...',
          '/zh-TW/': '搜尋...'
        },
        noData: 'No results!'
      }
    }
  </script>
  <!-- Docsify Scripts -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
