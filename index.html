<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agentic Bootstrap — AI-SOP Scaffold</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A zero-dependency template and interactive CLI to scaffold professional, quality-controlled AI Agent workflows.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Fonts: Inter (body), Outfit (headings), Fira Code (mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Docsify dark base — fewer specificity fights for dark-first design -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">

  <style>
    /* ============================================================
       DESIGN SYSTEM — "Editorial Engineering"
       Inspired by Stripe Docs / Vercel / Linear
       ============================================================ */

    /* --- Dark theme (default) --- */
    :root {
      --bg:          #0c0e14;
      --bg-sidebar:  #111318;
      --bg-surface:  #181b23;
      --bg-code:     #0a0c12;
      --border:      rgba(255,255,255,0.07);
      --border-focus:rgba(255,255,255,0.15);
      --text:        #d4d4d8;    /* zinc-300 */
      --text-dim:    #71717a;    /* zinc-500 */
      --text-bright: #fafafa;    /* zinc-50 */
      --accent:      #3b82f6;    /* blue-500 */
      --accent-dim:  rgba(59,130,246,0.12);
      --accent-glow: rgba(59,130,246,0.35);
      --code-inline-bg: rgba(59,130,246,0.08);
      --code-inline-fg: #93c5fd; /* blue-300 */
      --blockquote-border: #3b82f6;
      --blockquote-bg: rgba(59,130,246,0.04);
      --badge-shadow: none;
      --theme-color: var(--accent);
    }

    /* --- Light theme --- */
    body.light {
      --bg:          #fafafa;
      --bg-sidebar:  #f4f4f5;
      --bg-surface:  #ffffff;
      --bg-code:     #f4f4f5;
      --border:      rgba(0,0,0,0.06);
      --border-focus:rgba(0,0,0,0.15);
      --text:        #3f3f46;    /* zinc-700 */
      --text-dim:    #a1a1aa;    /* zinc-400 */
      --text-bright: #18181b;    /* zinc-900 */
      --accent:      #2563eb;    /* blue-600 */
      --accent-dim:  rgba(37,99,235,0.08);
      --accent-glow: rgba(37,99,235,0.25);
      --code-inline-bg: rgba(37,99,235,0.06);
      --code-inline-fg: #1d4ed8; /* blue-700 */
      --blockquote-border: #2563eb;
      --blockquote-bg: rgba(37,99,235,0.03);
      --badge-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    /* ============================================================
       GLOBAL RESETS & BASE
       ============================================================ */
    * { box-sizing: border-box; }

    body {
      background: var(--bg) !important;
      color: var(--text) !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
      font-size: 16px !important;
      line-height: 1.75 !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* ============================================================
       FLOATING ACTION BUTTONS (bottom-right stack)
       ============================================================ */
    .fab-stack {
      position: fixed;
      right: 28px;
      bottom: 28px;
      display: flex;
      flex-direction: column-reverse;
      gap: 12px;
      z-index: 999;
    }
    .fab-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fab-btn:hover {
      transform: scale(1.08);
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .theme-toggle-btn:hover {
      transform: scale(1.08) rotate(12deg);
    }
    /* Language toggle specific */
    .lang-toggle-btn {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    /* ============================================================
       SIDEBAR LANGUAGE VISIBILITY
       ============================================================ */
    .sidebar-nav > ul > li.lang-en,
    .sidebar-nav > ul > li.lang-zh {
      transition: opacity 0.2s ease, max-height 0.25s ease;
      overflow: hidden;
    }
    .sidebar-nav > ul > li.lang-hidden {
      opacity: 0;
      max-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      pointer-events: none;
    }

    /* ============================================================
       GITHUB CORNER (PRESERVED — theme-adaptive)
       ============================================================ */
    .github-corner svg {
      fill: var(--accent) !important;
      color: var(--bg) !important;
      transition: fill 0.25s ease, color 0.25s ease;
    }
    .github-corner:hover .octo-arm {
      animation: octocat-wave 560ms ease-in-out;
    }

    /* ============================================================
       SIDEBAR
       ============================================================ */
    .sidebar {
      background: var(--bg-sidebar) !important;
      border-right: 1px solid var(--border) !important;
      transition: background 0.25s ease;
    }

    /* App name — colorful gradient logo */
    .app-name-link {
      font-family: 'Outfit', sans-serif !important;
      font-weight: 700 !important;
      font-size: 1.25rem !important;
      background: linear-gradient(135deg, #38bdf8, #a78bfa) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
      letter-spacing: -0.3px;
      opacity: 1 !important;
      padding: 12px 0 8px !important;
    }

    /* Nav links */
    .sidebar-nav li a {
      color: var(--text-dim) !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      padding: 6px 0 !important;
      border-radius: 6px;
      transition: color 0.15s ease !important;
      border: none !important;
    }
    .sidebar-nav li a:hover {
      color: var(--text-bright) !important;
    }
    .sidebar-nav li.active > a {
      color: var(--accent) !important;
      font-weight: 600 !important;
    }

    /* Section group headers (bold items) */
    .sidebar-nav > ul > li > p,
    .sidebar-nav > ul > li > strong {
      font-family: 'Outfit', sans-serif;
      font-size: 11px !important;
      font-weight: 600 !important;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim) !important;
      margin: 20px 0 6px 0 !important;
      padding: 0 !important;
    }

    /* Search input */
    .search {
      border-bottom: 1px solid var(--border) !important;
      padding: 10px !important;
    }
    .search input {
      background: var(--bg-surface) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      padding: 8px 12px !important;
      font-size: 14px !important;
      font-family: 'Inter', sans-serif !important;
      outline: none !important;
      width: 100% !important;
      transition: border-color 0.2s ease !important;
    }
    .search input:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px var(--accent-dim) !important;
    }
    .search input::placeholder {
      color: var(--text-dim) !important;
    }
    .search .results-panel {
      background: var(--bg-surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
    }
    .search .matching-post {
      border-bottom: 1px solid var(--border) !important;
    }

    /* Sidebar toggle */
    .sidebar-toggle {
      background: var(--bg-surface) !important;
      border-right: 1px solid var(--border) !important;
    }
    .sidebar-toggle span {
      background: var(--text-dim) !important;
    }

    /* ============================================================
       CONTENT AREA
       ============================================================ */
    .markdown-section {
      max-width: 1000px !important;
      padding: 48px 40px !important;
    }

    /* --- Headings --- */
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      font-family: 'Outfit', sans-serif !important;
      color: var(--text-bright) !important;
      letter-spacing: -0.3px;
    }

    .markdown-section h1 {
      font-size: 2.0rem !important;
      font-weight: 700 !important;
      border-bottom: 1px solid var(--border) !important;
      padding-bottom: 12px !important;
      margin: 0 0 24px 0 !important;
    }
    .markdown-section h2 {
      font-size: 1.5rem !important;
      font-weight: 600 !important;
      margin: 48px 0 16px 0 !important;
      padding-bottom: 8px !important;
      border-bottom: 1px solid var(--border) !important;
    }
    .markdown-section h3 {
      font-size: 1.2rem !important;
      font-weight: 600 !important;
      margin: 36px 0 12px 0 !important;
    }
    .markdown-section h4 {
      font-size: 1.05rem !important;
      font-weight: 600 !important;
      margin: 28px 0 8px 0 !important;
    }

    /* --- Body text --- */
    .markdown-section p,
    .markdown-section li {
      color: var(--text) !important;
      line-height: 1.75 !important;
    }
    .markdown-section p {
      margin: 0 0 16px 0 !important;
    }
    .markdown-section ul, .markdown-section ol {
      margin: 0 0 16px 0 !important;
      padding-left: 24px !important;
    }
    .markdown-section li {
      margin-bottom: 6px !important;
    }

    /* --- Links: subtle, not screaming --- */
    .markdown-section a {
      color: var(--accent) !important;
      font-weight: inherit !important;
      text-decoration: none !important;
      border-bottom: none !important;
      transition: opacity 0.15s ease !important;
    }
    .markdown-section a:hover {
      text-decoration: underline !important;
      opacity: 0.85;
    }

    /* --- Inline code --- */
    .markdown-section code {
      font-family: 'Fira Code', monospace !important;
      font-size: 0.875em !important;
      background: var(--code-inline-bg) !important;
      color: var(--code-inline-fg) !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      border: none !important;
      font-weight: 400 !important;
    }

    /* --- Code blocks (MacOS terminal style) --- */
    .markdown-section pre {
      background: var(--bg-code) !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      padding: 38px 20px 20px 20px !important;
      position: relative;
      margin: 24px 0 !important;
      overflow-x: auto;
      box-shadow: none !important;
    }

    /* MacOS window dots */
    .markdown-section pre::before {
      content: "";
      position: absolute;
      top: 14px;
      left: 16px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff5f56;
      box-shadow: 16px 0 0 #ffbd2e, 32px 0 0 #27c93f;
    }

    .markdown-section pre code {
      background: transparent !important;
      color: var(--text) !important;
      padding: 0 !important;
      border: none !important;
      font-size: 14px !important;
      line-height: 1.6 !important;
    }

    /* --- Syntax highlighting (dark mode — Dracula-inspired) --- */
    body:not(.light) .token.comment,
    body:not(.light) .token.prolog,
    body:not(.light) .token.doctype,
    body:not(.light) .token.cdata        { color: #6b7280 !important; font-style: italic; }
    body:not(.light) .token.punctuation   { color: #a1a1aa !important; }
    body:not(.light) .token.property,
    body:not(.light) .token.tag,
    body:not(.light) .token.constant,
    body:not(.light) .token.symbol,
    body:not(.light) .token.deleted       { color: #f87171 !important; }
    body:not(.light) .token.boolean,
    body:not(.light) .token.number        { color: #c084fc !important; }
    body:not(.light) .token.selector,
    body:not(.light) .token.attr-name,
    body:not(.light) .token.string,
    body:not(.light) .token.char,
    body:not(.light) .token.builtin,
    body:not(.light) .token.inserted      { color: #4ade80 !important; }
    body:not(.light) .token.operator,
    body:not(.light) .token.entity,
    body:not(.light) .token.url           { color: #d4d4d8 !important; }
    body:not(.light) .token.atrule,
    body:not(.light) .token.attr-value,
    body:not(.light) .token.keyword       { color: #60a5fa !important; font-weight: 500; }
    body:not(.light) .token.function,
    body:not(.light) .token.class-name    { color: #fbbf24 !important; }

    /* --- Syntax highlighting (light mode) --- */
    body.light .token.comment,
    body.light .token.prolog,
    body.light .token.doctype,
    body.light .token.cdata        { color: #9ca3af !important; font-style: italic; }
    body.light .token.punctuation   { color: #6b7280 !important; }
    body.light .token.property,
    body.light .token.tag,
    body.light .token.constant,
    body.light .token.symbol,
    body.light .token.deleted       { color: #dc2626 !important; }
    body.light .token.boolean,
    body.light .token.number        { color: #7c3aed !important; }
    body.light .token.selector,
    body.light .token.attr-name,
    body.light .token.string,
    body.light .token.char,
    body.light .token.builtin,
    body.light .token.inserted      { color: #16a34a !important; }
    body.light .token.operator,
    body.light .token.entity,
    body.light .token.url           { color: #3f3f46 !important; }
    body.light .token.atrule,
    body.light .token.attr-value,
    body.light .token.keyword       { color: #2563eb !important; font-weight: 500; }
    body.light .token.function,
    body.light .token.class-name    { color: #d97706 !important; }

    /* --- Blockquotes --- */
    .markdown-section blockquote {
      border-left: 3px solid var(--blockquote-border) !important;
      border-top: none !important;
      border-right: none !important;
      border-bottom: none !important;
      background: var(--blockquote-bg) !important;
      border-radius: 0 8px 8px 0 !important;
      padding: 14px 20px !important;
      margin: 20px 0 !important;
    }
    .markdown-section blockquote p {
      color: var(--text) !important;
      font-style: normal !important;
      font-weight: 400 !important;
      margin: 0 !important;
    }

    /* --- Badges (shields.io) --- */
    .markdown-section img[src*="shields.io"],
    .markdown-section img[src*="img.shields.io"] {
      vertical-align: middle;
      margin-right: 4px;
      border-radius: 4px;
      box-shadow: var(--badge-shadow);
    }

    /* --- Mermaid diagrams --- */
    .mermaid {
      background: transparent !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      padding: 24px !important;
      margin: 24px 0 !important;
      overflow-x: auto;
      display: flex;
      justify-content: center;
    }
    .mermaid svg {
      max-width: 100% !important;
      height: auto !important;
    }

    /* --- Tables --- */
    .markdown-section table {
      width: 100%;
      margin: 24px 0;
      border-collapse: collapse;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .markdown-section th {
      background: var(--bg-surface);
      font-weight: 600;
      font-size: 14px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-bright);
      text-align: left;
    }
    .markdown-section td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
    }
    .markdown-section tr:last-child td { border-bottom: none; }

    /* --- Horizontal rules --- */
    .markdown-section hr {
      border: none !important;
      border-bottom: 1px solid var(--border) !important;
      margin: 40px 0 !important;
    }

    /* --- Strong/Bold --- */
    .markdown-section strong {
      color: var(--text-bright) !important;
      font-weight: 600;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media screen and (max-width: 768px) {
      .markdown-section {
        padding: 24px 16px !important;
      }
      .markdown-section h1 { font-size: 1.6rem !important; }
      .markdown-section h2 { font-size: 1.3rem !important; }
      .theme-toggle-btn {
        right: 16px;
        bottom: 16px;
        width: 42px;
        height: 42px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <!-- Floating Action Buttons (bottom-right) -->
  <div class="fab-stack">
    <button class="fab-btn theme-toggle-btn" id="theme-toggle" title="Toggle Theme" aria-label="Toggle Theme">🌙</button>
    <button class="fab-btn lang-toggle-btn" id="lang-toggle" title="Toggle Language" aria-label="Toggle Language">EN</button>
  </div>

  <div id="app">Loading…</div>

  <script>
    window.$docsify = {
      name: 'Agentic Bootstrap',
      repo: 'https://github.com/b1uewave/agentic-bootstrap',
      loadSidebar: true,
      coverpage: false,
      subMaxLevel: 2,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs…',
        noData: 'No results'
      }
    }
  </script>

  <!-- Theme toggle + Language toggle handlers -->
  <script>
    (function() {
      /* ---- Theme Toggle ---- */
      var themeBtn = document.getElementById('theme-toggle');
      var body = document.body;

      function applyDark() {
        body.classList.remove('light');
        themeBtn.textContent = '🌙';
        localStorage.setItem('theme', 'dark');
        if (window.mermaid) {
          mermaid.initialize({ startOnLoad: false, theme: 'dark', themeVariables: {
            background: '#181b23', primaryColor: '#1e293b', primaryTextColor: '#d4d4d8',
            lineColor: '#3b82f6', secondaryColor: '#3b82f6', tertiaryColor: '#181b23'
          }});
        }
      }

      function applyLight() {
        body.classList.add('light');
        themeBtn.textContent = '☀️';
        localStorage.setItem('theme', 'light');
        if (window.mermaid) {
          mermaid.initialize({ startOnLoad: false, theme: 'default', themeVariables: {
            background: '#ffffff', primaryColor: '#e0e7ff', primaryTextColor: '#18181b',
            lineColor: '#2563eb', secondaryColor: '#2563eb', tertiaryColor: '#f4f4f5'
          }});
        }
      }

      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') { applyLight(); } else { applyDark(); }

      themeBtn.addEventListener('click', function() {
        if (body.classList.contains('light')) { applyDark(); } else { applyLight(); }
        setTimeout(function() {
          document.querySelectorAll('.mermaid').forEach(function(el) {
            var code = el.getAttribute('data-original') || el.textContent;
            if (!el.getAttribute('data-original')) { el.setAttribute('data-original', code); }
            el.removeAttribute('data-processed');
            el.innerHTML = code;
          });
          if (window.mermaid) { mermaid.init(undefined, '.mermaid'); }
        }, 100);
      });

      /* ---- Language Toggle ---- */
      var langBtn = document.getElementById('lang-toggle');
      var currentLang = localStorage.getItem('lang') || 'en';

      // English header keywords
      var enHeaders = ['core docs', 'templates'];
      // Chinese header keywords
      var zhHeaders = ['核心文件', '範本文件'];

      function tagSidebarGroups() {
        var groups = document.querySelectorAll('.sidebar-nav > ul > li');
        groups.forEach(function(li) {
          // Get the group header text (the <p> or <strong> inside)
          var header = li.querySelector('p, strong');
          if (!header) return;
          var text = header.textContent.trim().toLowerCase();
          var isEn = enHeaders.some(function(h) { return text.indexOf(h) !== -1; });
          var isZh = zhHeaders.some(function(h) { return text.indexOf(h) !== -1; });
          if (isEn) {
            li.classList.add('lang-en');
            li.classList.remove('lang-zh');
          } else if (isZh) {
            li.classList.add('lang-zh');
            li.classList.remove('lang-en');
          }
        });
      }

      function applyLang(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        langBtn.textContent = lang === 'en' ? 'EN' : '中';
        langBtn.title = lang === 'en' ? 'Switch to 中文' : 'Switch to English';
        // Show/hide sidebar groups
        var groups = document.querySelectorAll('.sidebar-nav > ul > li');
        groups.forEach(function(li) {
          if (li.classList.contains('lang-en')) {
            li.classList.toggle('lang-hidden', lang !== 'en');
          } else if (li.classList.contains('lang-zh')) {
            li.classList.toggle('lang-hidden', lang !== 'zh');
          }
        });
      }

      langBtn.addEventListener('click', function() {
        applyLang(currentLang === 'en' ? 'zh' : 'en');
      });

      // Hook into Docsify lifecycle — re-tag sidebar after each page load
      window.$docsify = window.$docsify || {};
      window.$docsify.plugins = (window.$docsify.plugins || []).concat([
        function(hook) {
          hook.doneEach(function() {
            tagSidebarGroups();
            applyLang(currentLang);
          });
        }
      ]);
    })();
  </script>

  <!-- Docsify core + plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- Mermaid -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    // Initial mermaid config (matches dark default)
    mermaid.initialize({
      startOnLoad: false,
      theme: document.body.classList.contains('light') ? 'default' : 'dark',
      themeVariables: document.body.classList.contains('light')
        ? { background:'#ffffff', primaryColor:'#e0e7ff', primaryTextColor:'#18181b', lineColor:'#2563eb', secondaryColor:'#2563eb', tertiaryColor:'#f4f4f5' }
        : { background:'#181b23', primaryColor:'#1e293b', primaryTextColor:'#d4d4d8', lineColor:'#3b82f6', secondaryColor:'#3b82f6', tertiaryColor:'#181b23' }
    });

    // Hook Docsify markdown renderer for mermaid blocks
    window.$docsify.markdown = window.$docsify.markdown || {};
    window.$docsify.markdown.renderer = window.$docsify.markdown.renderer || {};
    window.$docsify.markdown.renderer.code = function(code, lang) {
      if (lang === 'mermaid') {
        return '<div class="mermaid">' + code + '</div>';
      }
      return this.origin.code.apply(this, arguments);
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@latest/dist/docsify-mermaid.js"></script>
</body>
</html>
